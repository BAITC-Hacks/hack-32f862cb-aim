name: OptiStock backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: optistock
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: optistock_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U optistock -d optistock_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OPTISTOCK_TEST_DATABASE_URL: postgresql+psycopg://optistock:test-only-password@localhost:5432/optistock_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: ruff check backend tests scripts migrations
      - run: ruff format --check backend tests scripts migrations
      - run: python scripts/test.py -q
